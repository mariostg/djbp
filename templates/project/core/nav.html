
{% load i18n %}
<nav>
    {% if request.path != '/' %}
      <a class='btn' href="{% url 'index' %}">{% trans "Home" %}</a>
    {% endif %}
    {% if request.user.is_authenticated %}
      <a class='btn' href="{% url 'logout' %}">{% trans "Logout" %}</a>
      {% if request.path != '/site-admin/' %}
        <a class='btn' href="{% url 'site-admin' %}">{% trans "Admin" %}</a>
      {% endif %}
    {% else %}
    {% if request.path != '/login/' %}
      <a class='btn' href="{% url 'login' %}">{% trans "Login" %}</a>
      {% endif %}
    {% endif %}
  </nav>
